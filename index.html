<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>San Francisco 2003 - Domain Map</title>
    <!-- Open Graph Tags -->
    <meta property="og:title" content="San Francisco 2003 - Domain Map">
    <meta property="og:description" content="Interactive Vampire: The Requiem Campaign Map">
    <meta property="og:image" content="https://raw.githubusercontent.com/adamvapp/VTR-Campaign/main/maptest.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        /* Custom Gothic Popup Styling */
        .leaflet-popup-content-wrapper {
            background: #141414;
            color: #d1d1d1;
            border: 1px solid #332222;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            font-size: 13px;
        }
        .leaflet-popup-tip {
            background: #141414;
            border: 1px solid #332222;
        }
        .leaflet-popup-content b {
            color: #b22222; /* Blood red header accent */
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .leaflet-popup-content i {
            color: #888;
        }
        /* Custom Dark Controls */
        .leaflet-control-layers, .map-legend, .district-sidebar {
            background: #141414 !important;
            color: #d1d1d1 !important;
            border: 1px solid #333 !important;
            border-radius: 4px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .leaflet-control-layers-expanded {
            background: #141414 !important;
            color: #d1d1d1 !important;
        }
        /* Map Legend Styling */
        .map-legend {
            line-height: 20px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
            border: 1px solid #fff;
        }
        /* District Sidebar Styling */
        .district-sidebar {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            width: 180px;
        }
        .district-sidebar h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #b22222;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .district-btn {
            display: block;
            width: 100%;
            background: #1f1f1f;
            color: #ccc;
            border: 1px solid #333;
            padding: 5px 8px;
            margin-bottom: 4px;
            text-align: left;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s, color 0.2s;
        }
        .district-btn:hover {
            background: #b22222;
            color: #fff;
        }

        /* Custom Gothic Map Pins */
        .gothic-pin {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: transform 0.2s ease;
        }
        .gothic-pin:hover {
            transform: scale(1.3);
        }
        .pin-camarilla {
            background-color: #b22222;
            box-shadow: 0 0 8px #ff0000;
        }
        .pin-anarch {
            background-color: #d4af37;
            box-shadow: 0 0 8px #ffaa00;
        }
        .pin-independent {
            background-color: #4a5568;
            box-shadow: 0 0 8px #718096;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Quick-Jump District Sidebar -->
    <div class="district-sidebar">
        <h4>Domain Quarters</h4>
        <button class="district-btn" onclick="zoomToDistrict(1394, 745, 1)">Nob Hill (Elysium)</button>
        <button class="district-btn" onclick="zoomToDistrict(1170, 623, 1)">The Castro</button>
        <button class="district-btn" onclick="zoomToDistrict(1008, 431, 1)">Twin Peaks</button>
        <button class="district-btn" onclick="zoomToDistrict(1218, 334, 1)">Golden Gate Park</button>
        <button class="district-btn" onclick="resetView()">Reset View</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize map with CRS.Simple
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1.5,
            maxZoom: 3,
            zoomSnap: 0.5
        });

        // 2. Define image bounds for 2000x2000px
        var w = 2000, h = 2000;
        var bounds = [[0, 0], [h, w]];
        
        // 3. Add the image overlay
        var image = L.imageOverlay('maptest.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // --- NAVIGATION HELPER FUNCTIONS ---
        function zoomToDistrict(y, x, zoomLevel) {
            map.setView([y, x], zoomLevel);
        }
        function resetView() {
            map.fitBounds(bounds);
        }

        // --- DEFINE CUSTOM GOTHIC ICONS ---
        var camarillaIcon = L.divIcon({ className: 'gothic-pin pin-camarilla', iconSize: [16, 16], iconAnchor: [8, 8] });
        var anarchIcon = L.divIcon({ className: 'gothic-pin pin-anarch', iconSize: [16, 16], iconAnchor: [8, 8] });
        var independentIcon = L.divIcon({ className: 'gothic-pin pin-independent', iconSize: [16, 16], iconAnchor: [8, 8] });

        // --- LAYER GROUPS FOR FILTERING ---
        var camarillaLayer = new L.LayerGroup();
        var anarchLayer = new L.LayerGroup();
        var territoryLayer = new L.LayerGroup();

        // 4. District Borders & Territories
        var goldenGatePolygon = L.polygon([
            [1235, 180], [1187, 182], [1203, 470], [1255, 484]
        ], {color: '#2e8b57', fillColor: '#2e8b57', fillOpacity: 0.2, weight: 1.5});
        goldenGatePolygon.bindPopup("<b>The Wilds / Golden Gate Park</b><br><i>Untamed territory at night.</i><br>Status: High Hazard.");
        territoryLayer.addLayer(goldenGatePolygon);

        // 5. Waypoints & Markers with Lore-Rich Popups
        var graceCathedral = L.marker([1394, 745], {icon: camarillaIcon});
        graceCathedral.bindPopup("<b>Grace Cathedral</b><br><i>Camarilla Elysium</i><br>Neutral ground under strict surveillance by the Prince's hounds.");
        camarillaLayer.addLayer(graceCathedral);

        var castro = L.marker([1170, 623], {icon: anarchIcon});
        castro.bindPopup("<b>The Castro Theater</b><br><i>Anarch Territory</i><br>Primary gathering hub and cultural anchor for local free-states.");
        anarchLayer.addLayer(castro);

        var twinPeaks = L.marker([1008, 431], {icon: independentIcon});
        twinPeaks.bindPopup("<b>Twin Peaks Tunnel</b><br><i>Nosferatu Warrens</i><br>Subterranean transit network. Unauthorized entry forbidden.");
        territoryLayer.addLayer(twinPeaks);

        var ggPark = L.marker([1218, 334], {icon: independentIcon});
        ggPark.bindPopup("<b>The Wilds (Golden Gate Park)</b><br><i>Restricted Zone</i><br>Dangerous feral territory; avoid after midnight.");
        territoryLayer.addLayer(ggPark);

        // Add default layers to map
        camarillaLayer.addTo(map);
        anarchLayer.addTo(map);
        territoryLayer.addTo(map);

        // 6. Layer Control UI
        var overlayMaps = {
            "Camarilla Domain": camarillaLayer,
            "Anarch Territory": anarchLayer,
            "Sanctuaries & Zones": territoryLayer
        };
        L.control.layers(null, overlayMaps, {collapsed: false}).addTo(map);

        // 7. Custom Map Legend Control
        var LegendControl = L.Control.extend({
            options: { position: 'bottomleft' },
            onAdd: function (map) {
                var div = L.DomUtil.create('div', 'map-legend');
                div.innerHTML = `
                    <b>Census Index</b><br>
                    <div class="legend-item"><span class="legend-color" style="background:#b22222;"></span>Camarilla</div>
                    <div class="legend-item"><span class="legend-color" style="background:#d4af37;"></span>Anarch</div>
                    <div class="legend-item"><span class="legend-color" style="background:#4a5568;"></span>Independent / Wilds</div>
                `;
                return div;
            }
        });
        map.addControl(new LegendControl());

        // Coordinate Click-Logger Tool (Active for manual placement)
        map.on('click', function(e) {
            var y = Math.round(e.latlng.lat);
            var x = Math.round(e.latlng.lng);
            console.log("Clicked coordinates: [" + y + ", " + x + "]");
            L.popup()
                .setLatLng(e.latlng)
                .setContent("Coordinates: [" + y + ", " + x + "]")
                .openOn(map);
        });
    </script>

</body>
</html>
